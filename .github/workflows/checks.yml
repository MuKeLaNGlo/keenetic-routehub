name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Panel and Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: module/panel/package.json
      - name: Build and lint the panel
        working-directory: module/panel
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
      - name: Rust workspace tests
        working-directory: module-rust
        run: |
          cargo test --locked --workspace --lib --bins --tests
          cargo test --locked --manifest-path crates/native-awg/Cargo.toml --lib

  arm64:
    name: Entware IPK (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: module/panel/package.json
      - name: Build the Rust daemon and Entware package
        run: |
          python3 module/packaging/build_ipk.py \
            --rebuild-panel \
            --version '0.6.11~ci-1' \
            --output-dir "$PWD/dist"
