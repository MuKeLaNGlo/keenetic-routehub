name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Panel, Rust and Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: module/panel/package.json
      - name: Build and lint the panel
        working-directory: module/panel
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: module/go.mod
          cache-dependency-path: module/go.sum
      - name: Go compatibility tests
        working-directory: module
        run: go test -mod=readonly ./...
      - name: Rust workspace tests
        working-directory: module-rust
        run: cargo test --locked --workspace --lib --bins --tests

  arm64:
    name: Entware IPK (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: module/panel/package.json
      - name: Build the embedded panel
        working-directory: module/panel
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build the Rust daemon and Entware package
        run: |
          sh module-rust/tools/build-arm64.sh "$PWD/build/arm64"
          python3 module/packaging/build_ipk.py \
            --binary "$PWD/build/arm64/routehub-rust" \
            --version '0.6.11~ci-1' \
            --output-dir "$PWD/dist"
