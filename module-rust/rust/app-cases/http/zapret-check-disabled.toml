[request]
method = "POST"
path = "/api/zapret/check"
body = '{"service": "youtube"}'

[request.headers]
Content-Type = "application/json"
Origin = "http://127.0.0.1:18387"
X-RouteHub-Key = "local-fixture-key-not-used-on-router"

[response]
status = 200

[response.headers]
cache-control = "no-store"
content-security-policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
content-type = "application/json; charset=utf-8"
x-content-type-options = "nosniff"
