[package]
name = "routehub"
version = "0.6.10"
edition = "2024"
rust-version = "1.97"
publish = false

[features]
default = ["native-awg"]
native-awg = ["dep:routehub-native-awg"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
flate2 = "1"
getrandom = "0.3"
hex = "0.4"
hickory-proto = "0.26.3"
ipnet = "2"
libc = "0.2"
pbkdf2 = "0.12"
percent-encoding = "2"
psl = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
routehub-imports = { path = "../crates/imports" }
routehub-native-awg = { path = "../crates/native-awg", optional = true }
routehub-policy = { path = "../crates/policy" }
routehub-subscriptions = { path = "../crates/subscriptions", default-features = false, features = ["http"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "sync", "process", "signal", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
webpki-roots = "1"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
