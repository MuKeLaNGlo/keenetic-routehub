[package]
name = "routehub-imports"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
flate2 = "1"
idna = "1"
ipnet = "2"
percent-encoding = "2"
regex = "1"
routehub-subscriptions = { path = "../subscriptions", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"
yaml-rust2 = { version = "0.10", default-features = false }

[dev-dependencies]
sha2 = "0.10"
